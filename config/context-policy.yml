context:
  max_tokens_target: 40000

context_management:
  max_tokens: 200000
  flush_threshold: 120000
  compact_threshold: 160000

memory:
  flush_after_task: true
  flush_strategy: summarize
  keep_summary_lines: 10
  keep_goal: true
  keep_changed_files: true

files:
  include:
    - changed_files
    - related_files
  exclude:
    - docs/
    - tests/
    - data/
    - logs/
    - workspace/
    - backups/

large_files:
  max_lines: 200
  strategy: summarize

tool_output:
  max_lines: 50

sessions:
  close_child_sessions: true
